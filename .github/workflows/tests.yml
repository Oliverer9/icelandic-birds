# Runs the accessibility tests on Project B every time something is pushed.
name: Accessibility tests

on:
  push:
  pull_request:

jobs:
  test-b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=b
